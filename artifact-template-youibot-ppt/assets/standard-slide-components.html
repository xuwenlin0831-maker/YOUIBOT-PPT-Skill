<!--
YOUIBOT fixed review components.
Replace {{...}} tokens, inline the style block into the review deck, and copy the
required template content into .deck-stage. Do not ship unresolved tokens.
-->
<style data-youibot-standard-components>
.cover-slide,.section-slide{background:#f5f6f7;color:#353334}
.cover-slide::before,.cover-slide::after,.section-slide::before,.section-slide::after{display:none}
.cover-slide .slide-chrome,.section-slide .slide-chrome{display:none}
.cover-template-bg,.section-template-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
.cover-brand,.section-brand{position:absolute;left:118px;top:75px;width:132px;height:auto;z-index:5}
.cover-copy{position:absolute;left:118px;top:410px;width:930px;z-index:4}
.cover-copy h1{margin:0;font-size:78px;line-height:1.16;letter-spacing:-3px;font-weight:900;color:#3f3d3d}
.cover-copy>p{margin:30px 0 0;font-size:29px;font-weight:700;color:#4d4a49;letter-spacing:.5px}
.cover-meta{display:flex;gap:0;margin-top:18px;font-size:21px;color:#4f4d4c}
.cover-meta span+span::before{content:"·";margin:0 15px;color:var(--orange,#EE742A);font-weight:900}
.cover-version{margin-top:18px;color:#8d8884;font-size:17px;letter-spacing:1px}
.cover-ribbon,.section-ribbon{position:absolute;right:0;top:435px;width:975px;height:200px;background:rgba(238,116,42,.61);clip-path:polygon(13% 0,100% 4%,91% 100%,0 82%);z-index:1}
.cover-ribbon::after,.section-ribbon::after{content:"";position:absolute;left:190px;right:0;top:74px;height:120px;background:rgba(255,255,255,.2);transform:skewX(-17deg)}
.cover-visual{position:absolute;right:70px;top:60px;width:730px;height:895px;z-index:3}
.cover-visual img{width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply;transform:rotate(-1deg);-webkit-mask-image:radial-gradient(ellipse 72% 82% at 50% 50%,#000 58%,rgba(0,0,0,.96) 72%,transparent 100%);mask-image:radial-gradient(ellipse 72% 82% at 50% 50%,#000 58%,rgba(0,0,0,.96) 72%,transparent 100%)}
.cover-slogan,.section-slogan{position:absolute;left:118px;bottom:68px;width:600px;height:auto;z-index:5}
.section-copy{position:absolute;left:118px;top:240px;width:980px;z-index:5}
.section-part{display:flex;align-items:flex-end;gap:18px;height:220px;padding-bottom:24px}
.section-part span{padding-bottom:20px;color:#8b8885;font-size:20px;font-weight:900;letter-spacing:5px}
.section-part strong{color:var(--orange,#EE742A);font-size:154px;line-height:1.1;letter-spacing:-8px}
.section-copy>p{margin:-10px 0 12px;color:#7c7875;font-size:19px;font-weight:800;letter-spacing:3.5px}
.section-copy h2{margin:0;color:#3f3d3d;font-size:78px;line-height:1.12;letter-spacing:-3px}
.section-copy>em{display:block;margin-top:28px;color:#4f4c4a;font-size:27px;font-style:normal;font-weight:700}
.section-visual{position:absolute;right:70px;top:115px;width:720px;height:800px;z-index:4}
.section-caption{position:absolute;right:35px;bottom:18px;padding:10px 15px;background:rgba(255,255,255,.82);color:#6f6c69;font-size:15px;font-weight:800;letter-spacing:1.5px}
.section-hardware img{width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply;-webkit-mask-image:radial-gradient(ellipse 76% 78% at 52% 50%,#000 58%,rgba(0,0,0,.94) 72%,transparent 100%);mask-image:radial-gradient(ellipse 76% 78% at 52% 50%,#000 58%,rgba(0,0,0,.94) 72%,transparent 100%)}
.section-communication{right:105px;top:170px;width:610px;height:610px;border:2px solid rgba(79,77,80,.14);border-radius:50%;background:rgba(255,255,255,.34)}
.comms-core{position:absolute;left:213px;top:213px;width:184px;height:184px;display:flex;align-items:center;justify-content:center;border:12px solid var(--orange,#EE742A);border-radius:50%;background:#fff;color:#4f4d50;font-size:34px;font-weight:900;letter-spacing:2px}
.comms-node{position:absolute;width:150px;height:76px;display:flex;align-items:center;justify-content:center;border-top:7px solid var(--orange,#EE742A);background:#fff;box-shadow:0 12px 30px rgba(79,77,80,.1);font-size:20px;font-weight:900}
.node-a{left:36px;top:52px}.node-b{right:36px;top:52px}.node-c{left:36px;bottom:52px}.node-d{right:36px;bottom:52px}
.comms-link{position:absolute;width:145px;height:4px;background:#706d6b;transform-origin:left center}
.link-a{left:164px;top:150px;transform:rotate(34deg)}.link-b{left:445px;top:150px;transform:rotate(146deg)}.link-c{left:164px;top:455px;transform:rotate(-34deg)}.link-d{left:445px;top:455px;transform:rotate(214deg)}
.section-software{right:105px;top:170px;width:650px;height:610px;display:flex;flex-direction:column-reverse;justify-content:center;gap:16px}
.section-software>div{height:112px;display:grid;grid-template-columns:78px 1fr;align-items:center;padding:0 36px;border-left:10px solid var(--orange,#EE742A);background:rgba(255,255,255,.91);box-shadow:0 12px 35px rgba(79,77,80,.1)}
.section-software>div:nth-child(2){margin-left:42px}.section-software>div:nth-child(3){margin-left:84px}.section-software>div:nth-child(4){margin-left:126px;background:#4f4d50;color:#fff}
.section-software span{color:var(--orange,#EE742A);font-size:18px;font-weight:900}.section-software b{font-size:29px}
.model-disclaimer{width:790px;margin-top:34px;padding:18px 24px;border-left:8px solid var(--orange,#EE742A);background:rgba(255,255,255,.72);font-size:18px;line-height:1.5}
.model-disclaimer b{margin-right:18px;color:var(--orange,#EE742A)}
</style>

<template data-component-id="COVER-01">
<section class="slide company-slide cover-slide" data-slide-id="{{slide_id}}" data-slide-title="{{deck_title}}">
  <div class="slide-content">
    <img class="cover-template-bg" src="{{clean_background_src}}" alt="">
    <img class="cover-brand" src="{{official_logo_src}}" alt="YOUIBOT 优艾智合">
    <div class="cover-copy" data-editable>
      <h1>{{title_html}}</h1>
      <p>{{subtitle}}</p>
      <div class="cover-meta"><span>{{department}}</span><span>{{presenter}}</span><span>{{date}}</span></div>
      <div class="cover-version">{{version_and_confidentiality}}</div>
    </div>
    <div class="cover-ribbon" aria-hidden="true"></div>
    <div class="cover-visual"><img src="{{official_industry_scene_src}}" alt="{{official_industry_scene_alt}}"></div>
    <img class="cover-slogan" src="{{official_slogan_src}}" alt="探索你、我、机器人和谐共生的世界">
  </div>
</section>
</template>

<template data-component-id="DIVIDER-01-HARDWARE">
<section class="slide company-slide section-slide" data-slide-id="{{slide_id}}" data-slide-title="{{chapter_title}}">
  <div class="slide-content">
    <img class="section-template-bg" src="{{clean_background_src}}" alt="">
    <img class="section-brand" src="{{official_logo_src}}" alt="YOUIBOT 优艾智合">
    <div class="section-copy" data-editable>
      <div class="section-part"><span>PART</span><strong>{{part_number}}</strong></div>
      <p>{{english_chapter_label}}</p><h2>{{chapter_title}}</h2><em>{{chapter_purpose}}</em>
    </div>
    <div class="section-ribbon" aria-hidden="true"></div>
    <div class="section-visual section-hardware">
      <img src="{{verified_hardware_visual_src}}" alt="{{verified_hardware_visual_alt}}">
      <div class="section-caption">{{hardware_caption}}</div>
    </div>
    <img class="section-slogan" src="{{official_slogan_src}}" alt="探索你、我、机器人和谐共生的世界">
  </div>
</section>
</template>

<template data-component-id="DIVIDER-01-COMMUNICATION">
<section class="slide company-slide section-slide" data-slide-id="{{slide_id}}" data-slide-title="{{chapter_title}}">
  <div class="slide-content">
    <img class="section-template-bg" src="{{clean_background_src}}" alt="">
    <img class="section-brand" src="{{official_logo_src}}" alt="YOUIBOT 优艾智合">
    <div class="section-copy" data-editable>
      <div class="section-part"><span>PART</span><strong>{{part_number}}</strong></div>
      <p>{{english_chapter_label}}</p><h2>{{chapter_title}}</h2><em>{{chapter_purpose}}</em>
    </div>
    <div class="section-ribbon" aria-hidden="true"></div>
    <div class="section-visual section-communication" aria-label="{{topology_aria_label}}">
      <div class="comms-core">{{core_label}}</div>
      <i class="comms-link link-a"></i><i class="comms-link link-b"></i><i class="comms-link link-c"></i><i class="comms-link link-d"></i>
      <span class="comms-node node-a">{{node_a}}</span><span class="comms-node node-b">{{node_b}}</span>
      <span class="comms-node node-c">{{node_c}}</span><span class="comms-node node-d">{{node_d}}</span>
    </div>
    <img class="section-slogan" src="{{official_slogan_src}}" alt="探索你、我、机器人和谐共生的世界">
  </div>
</section>
</template>

<template data-component-id="DIVIDER-01-SOFTWARE">
<section class="slide company-slide section-slide" data-slide-id="{{slide_id}}" data-slide-title="{{chapter_title}}">
  <div class="slide-content">
    <img class="section-template-bg" src="{{clean_background_src}}" alt="">
    <img class="section-brand" src="{{official_logo_src}}" alt="YOUIBOT 优艾智合">
    <div class="section-copy" data-editable>
      <div class="section-part"><span>PART</span><strong>{{part_number}}</strong></div>
      <p>{{english_chapter_label}}</p><h2>{{chapter_title}}</h2><em>{{chapter_purpose}}</em>
      <div class="model-disclaimer"><b>{{disclaimer_label}}</b><span>{{disclaimer_text}}</span></div>
    </div>
    <div class="section-ribbon" aria-hidden="true"></div>
    <div class="section-visual section-software" aria-label="{{layers_aria_label}}">
      <div><span>04</span><b>{{layer_4}}</b></div><div><span>03</span><b>{{layer_3}}</b></div>
      <div><span>02</span><b>{{layer_2}}</b></div><div><span>01</span><b>{{layer_1}}</b></div>
    </div>
    <img class="section-slogan" src="{{official_slogan_src}}" alt="探索你、我、机器人和谐共生的世界">
  </div>
</section>
</template>
