interface:
  display_name: "YOUIBOT 公司 PPT"
  short_description: "先确认大纲和 HTML，再生成可编辑公司 PPT"
  icon_large: "./assets/preview.png"
  brand_color: "#EE742A"
  default_prompt: "使用 $artifact-template-youibot-ppt 制作 YOUIBOT 公司格式演示文稿。先读取并审计资料，判断是培训/SOP型、汇报/数据型或混合型，并集中补问缺失信息；数据缺少单位、周期、目标、对比基准或来源时必须追问。确认需求简报和页级大纲后才能生成可备注的 HTML。HTML 生成或修订并通过检查后，自动在 Codex 浏览器中打开并返回可点击的绝对路径、页数和审阅状态。首页默认保留官方产业场景图，章节页使用内置标准组件。只有在我明确确认‘HTML已定稿，可以生成PPT’后，才能生成可编辑 PPTX。"
policy:
  allow_implicit_invocation: true
